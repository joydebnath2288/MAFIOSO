# MAFIOSO Application Configuration (non-secret defaults only)
# Sensitive database credentials and bootstrap admin secrets must be supplied via environment variables.
app.name=MAFIOSO
app.milestone=4
app.version=0.4.0-SNAPSHOT
db.connect.timeout.ms=5000
db.socket.timeout.ms=10000
storage.documents.dir=/var/mafioso/storage/documents
storage.documents.max.bytes=10485760

# Session & Authentication Security Defaults
session.timeout.minutes=30
auth.bcrypt.cost=12
auth.rate.limit.enabled=true
auth.rate.limit.max.attempts=5
auth.rate.limit.ip.max.attempts=25
auth.rate.limit.window.seconds=300
auth.rate.limit.lockout.seconds=300
