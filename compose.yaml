name: mafioso

services:
  db:
    image: mysql:8.0.46-oraclelinux9
    restart: unless-stopped
    expose:
      - "3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME must be set in .env}
      MYSQL_USER: ${DB_USER:?DB_USER must be set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD must be set in .env}
    volumes:
      - mafioso_mysql_data:/var/lib/mysql
      - ./database/init:/docker-entrypoint-initdb.d:ro
      - ./database/schema.sql:/opt/mafioso/db/schema.sql:ro
      - ./database/seed.sql:/opt/mafioso/db/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e \"SELECT 1\" \"$$MYSQL_DATABASE\" >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mafioso_internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:?DB_NAME must be set in .env}
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_USE_SSL: ${DB_USE_SSL:-false}
      STORAGE_UPLOAD_DIR: ${STORAGE_UPLOAD_DIR:-/var/mafioso/storage/documents}
    volumes:
      - mafioso_student_documents:${STORAGE_UPLOAD_DIR:-/var/mafioso/storage/documents}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mafioso_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_NAME: ${VITE_APP_NAME:-MAFIOSO}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${APP_HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - mafioso_internal

networks:
  mafioso_internal:
    driver: bridge

volumes:
  mafioso_mysql_data:
  mafioso_student_documents:
